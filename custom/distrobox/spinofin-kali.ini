# spinofin-kali.ini -- the single shared, rootful Kali toolbox container.
# Heavy pentest tooling lives here (apt, container-local); the Bluefin host
# stays pristine. Provisioned by: ujust setup-kali
#
# Assemble with: distrobox assemble create --file <this file>
# Do NOT run that under sudo: for a rootful box, set root=true below and run
# assemble as your NORMAL user, so distrobox keeps your $HOME. distrobox-export
# from setup-metasploit / export-impacket / setup-powerview relies on that
# (their wrappers must land in your ~/.local/bin, not root's).

[spinofin-kali]
image=docker.io/kalilinux/kali-rolling:latest
hostname=spinofin-kali   # sudo prompt shows "(on spinofin-kali)" so it's unambiguous
pull=true                # check for a newer image on (re)assemble
replace=true             # let `ujust rebuild-kali` replace an existing container
root=true                # rootful -> real CAP_NET_RAW etc. for nmap raw-socket scans
start_now=true           # do the heavy pull+install up front, not on first enter
init=true                # systemd as PID 1 (BloodHound/neo4j/postgresql need it)

# Packages installed INSIDE the container via apt (container-local; does not
# touch the host or the no-layering policy). Notes on the non-obvious ones:
#   impacket-scripts     surfaced to the host by `ujust export-impacket`; kept
#                        here for that export even though the in-sandbox copy
#                        lives in kalicli (custom/quadlet/Containerfile)
#   seclists, wordlists  Kali wordlist trees (~1 GB+; makes assemble heavier)
#   nmap, tcpdump        container-side so they get CAP_NET_RAW (nmap is also
#                        present on the host as a dependency of brew's rustscan)
#   libkrb5-dev,         build deps for powerview.py's gssapi C extension;
#   python3-dev, pipx    used by `ujust setup-powerview`
#   rlwrap                readline wrapper; ALSO brew-installed on the host
#                        (custom/brew/default.Brewfile) -- deliberately on
#                        both sides: host tools pipe through it directly
#                        (e.g. `rlwrap nc`), while raw shells caught inside
#                        the container need the container's own copy
#                        (e.g. `kali rlwrap nc -lvnp 4444`)
#   faketime              container-only; no host brew formula carries this
#   golang-go             provides /usr/bin/go; build dep for `ujust
#                        setup-kerbrute`'s container-local `go install`, same
#                        role libkrb5-dev/python3-dev/pipx play for
#                        setup-powerview below
# distrobox compounds multiple additional_packages= lines, so they're grouped
# here (one apt group per line) for readability -- see notes above.
#
# This box holds only what needs its privileges: raw sockets (nmap/tcpdump),
# systemd services (metasploit/bloodhound/postgresql), build deps for the
# pinned installs, wordlists, and host-export. Connect-based CLI tooling that
# needs none of that (sqlmap, wfuzz, netexec, enum4linux-ng, ...) lives in the
# rootless `kalicli` container instead (custom/quadlet/Containerfile); trusted
# host-native tools (ffuf, gobuster, nikto, sslscan, hydra, john) come from
# brew. impacket-scripts is the one tool intentionally in both boxes (see above).
additional_packages="metasploit-framework postgresql"
additional_packages="impacket-scripts"
additional_packages="seclists wordlists"
additional_packages="nmap tcpdump netcat-openbsd rlwrap faketime"
additional_packages="libkrb5-dev python3-dev pipx golang-go"
additional_packages="systemd libpam-systemd"
additional_packages="vim nano fastfetch git"

# msfconsole/msfvenom and the impacket-* wrappers are exported to the host
# dynamically (by setup-metasploit / export-impacket), not here -- so exports
# track whether the DB is actually ready. msfdb init also lives in
# setup-metasploit (needs PostgreSQL running). See kali-container.just.
