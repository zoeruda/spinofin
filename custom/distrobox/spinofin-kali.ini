# spinofin-kali.ini -- declarative manifest for the Kali "toolbox" container.
#
# This is the single shared Kali container that hosts heavy pentest tooling
# (Phase 2 architecture: pristine Bluefin host, Kali userspace in a container).
# It is provisioned by `ujust setup-kali` now, and by a first-boot systemd
# service later (Phase 2, step 2).
#
# IMPORTANT -- how to assemble this correctly:
#   distrobox assemble create --file <this file>
#
# Do NOT run that command under sudo. For a ROOTFUL box, set root=true here
# (below) and run `distrobox assemble` as your NORMAL user. Distrobox escalates
# privilege per-operation internally, and -- critically -- keeps your user's
# $HOME so the exported `msfconsole` wrapper lands in YOUR ~/.local/bin, not in
# root's home. Running the whole assemble under sudo is explicitly unsupported
# upstream and would misplace the export.
#
# First `setup-kali` is HEAVY: it pulls kali-rolling and installs
# metasploit-framework + postgresql inside the container. Expect a long run.

[spinofin-kali]
# Official Kali rolling image (Debian-based, bleeding-edge tool versions).
image=docker.io/kalilinux/kali-rolling:latest

# Explicit hostname (rather than whatever podman/distrobox would default to).
# Lets the container's own /etc/sudoers.d prompt show "(on spinofin-kali)" via
# sudo's %h escape -- see the sudo-prompt setup in `setup-kali` below -- so a
# sudo password prompt is never ambiguous about whether it wants the host's
# password or the container's.
hostname=spinofin-kali

# Always check for a newer image on (re)assemble.
pull=true

# `ujust rebuild-kali` relies on this to replace an existing container.
replace=true

# ROOTFUL: run under rootful Podman so the container gets real kernel
# capabilities (CAP_NET_RAW etc.), which nmap raw-socket scans and packet
# tooling need to behave like real Kali. Heavier and needs sudo to manage,
# but chosen deliberately to avoid a rootless->rootful migration later.
root=true

# Create AND initialize immediately, so `setup-kali` does the heavy
# pull+install up front rather than deferring it to first `enter`.
start_now=true

# INIT CONTAINER: run systemd as PID 1 inside the box. BloodHound CE is managed
# by a systemd unit (bloodhound.service), and Kali's `bloodhound-start` drives
# it via systemctl -- which fails in a non-init container ("System has not been
# booted with systemd as init system (PID 1)"). This reverses the earlier
# non-init choice; it makes the box heavier but lets Kali's own service helpers
# (bloodhound, neo4j, postgresql) work as they do on stock Kali. `service ...`
# still works for the Metasploit setup, so existing recipes are unaffected.
init=true

# Installed INSIDE the container via apt (container-local -- this does NOT
# touch the host and does NOT violate the host no-layering policy).
# metasploit-framework: the framework + msfconsole + msfdb tooling.
# postgresql: the database backend msfdb wires Metasploit to.
# impacket-scripts: the /usr/bin/impacket-* wrappers (pulls python3-impacket).
#   They live ONLY in the container; `ujust export-impacket` surfaces them to
#   the host shell as distrobox wrappers (see kali-container.just) so there is
#   a single source of truth and no host/container binary drift. (soaphound's
#   own pipx-bundled impacket is isolated in its venv and never on $PATH, so it
#   does not collide with these.)
# seclists, wordlists: the standard Kali wordlist trees at /usr/share/seclists
#   and /usr/share/wordlists (rockyou + the symlink farm). Baking them here
#   means they are present at the canonical paths as soon as the container is
#   assembled -- i.e. ready at first boot once the first-boot provisioning
#   service lands, and right after `ujust setup-kali` until then. To use them
#   from HOST-native tools too, `ujust link-wordlists` stages real files into
#   the shared $HOME (~/.local/share/spinofin/wordlists). NOTE: seclists is
#   large (~1 GB+); this makes the assemble heavier by design.
# systemd, libpam-systemd: required because this is an init container (see
#   init=true above) -- distrobox needs systemd present to run it as PID 1.
# vim, nano: editors -- vim for power users, nano for quick in-container edits.
# fastfetch: system-info banner, quality-of-life on container entry.
# nmap: INSIDE the container so it runs with CAP_NET_RAW (rootful), enabling
#   raw-socket SYN scans (-sS), OS detection (-O), and script engine (--script).
#   Host-side brew nmap is limited to unprivileged connect scans (-sT); this is
#   the container's primary reason to exist with root=true. Having nmap in both
#   places is intentional -- different capability levels, not redundancy.
# git: needed for ad-hoc tool installs / script clones inside the container
#   (e.g. LinPEAS, custom exploit PoCs). Universal utility.
# tcpdump: packet capture using CAP_NET_RAW. Pairs with the rootful container
#   for network analysis without spinning up a full Wireshark session.
# netcat-openbsd: the classic `nc` -- reverse shells, port testing, simple
#   file transfer between container and host. Fundamental pentest utility.
# libkrb5-dev, python3-pipx: build dependency + installer for powerview.py
#   (cannot install host-side via brew pipx -- gssapi ships no Linux manylinux
#   wheels and always builds from source, requiring krb5 headers that are absent
#   on Bluefin and forbidden by the no-layering policy). Both are apt-legal
#   inside the container. `ujust setup-powerview` uses these.
# netexec (nxc): SMB / LDAP / WinRM / RDP / SSH / MSSQL lateral-movement
#   and enumeration tool -- the actively maintained CrackMapExec successor.
#   Small (~3.6 MB), deps overlap with impacket-scripts already present.
# enum4linux-ng: next-gen SMB/Samba/AD enumeration wrapper (JSON/YAML output).
#   Essential first step against any Windows/AD target. Small, pure Python.
# sqlmap: automated SQL injection and database takeover. Too core to leave as
#   an on-demand toolset install.
# wfuzz: web application fuzzer (forms, headers, params, directories). Only a
#   stale Python-2 third-party brew tap exists upstream, so the apt-packaged
#   Kali build is the clean install (see custom/pipx/default.pipx for why this
#   isn't host-side).
additional_packages="metasploit-framework postgresql impacket-scripts seclists wordlists systemd libpam-systemd vim nano fastfetch nmap git tcpdump netcat-openbsd libkrb5-dev python3-pipx netexec enum4linux-ng sqlmap wfuzz"

# Export msfconsole to the host so you can run `msfconsole` directly.
# Path is the binary's location INSIDE the container. (The impacket-* set is
# large and changes across versions, so it is exported dynamically via
# `ujust export-impacket` rather than hard-coded here.)
exported_bins="/usr/bin/msfconsole"

# exported_bins_path defaults to ${HOME}/.local/bin, which is correct when
# assemble is run as your user (see the IMPORTANT note above). Bluefin already
# has ~/.local/bin on PATH, so the exported command is immediately runnable.
#
# NOTE: msfdb init is deliberately NOT done here as an init_hook. It needs
# PostgreSQL running and benefits from being re-runnable, so it lives in the
# `ujust setup-metasploit` recipe instead (which the first-boot service will
# also call). See custom/ujust/kali-container.just.
