---
name: Build and Push Image

# PR builds are disabled by default to save CI minutes. To enable them, add:
#   pull_request:
#     branches:
#       - main
#     paths-ignore:
#       - "**.md"
#       - ".github/workflows/*validate*.yml"
on:
  push:
    branches:
      - main # publishes :stable
      - testing # publishes :testing
    paths-ignore:
      - "**.md"
      - ".github/workflows/*validate*.yml"
  schedule:
    - cron: "05 10 * * *" # 10:05am UTC everyday
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_VENDOR: "${{ github.repository_owner }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  IMAGE_DESC: "My Customized Universal Blue Image"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"
  DEFAULT_TAG: "stable"
  REGISTRY_CACHE_WRITE: ${{ github.event_name != 'pull_request' && '1' || '0' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          # Stream/tag is derived from the branch: the testing branch publishes
          # the :testing stream, everything else (main, scheduled, dispatch)
          # publishes :stable. This overrides the workflow-level DEFAULT_TAG for
          # all subsequent steps via $GITHUB_ENV.
          if [[ "${GITHUB_REF}" == "refs/heads/testing" ]]; then
            echo "DEFAULT_TAG=testing" >> ${GITHUB_ENV}
          else
            echo "DEFAULT_TAG=stable" >> ${GITHUB_ENV}
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Preflight
        id: preflight
        uses: projectbluefin/actions/bootc-build/preflight@ae3c45762b7eebb188dbd4850d23042e96e539d8 # v1
        with:
          registry: ghcr.io
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@ae3c45762b7eebb188dbd4850d23042e96e539d8 # v1
        with:
          storage-backend: btrfs
          update-podman: "true"
          install-tools: '["just"]'

      - name: Restore DNF cache
        id: dnf-cache-restore
        uses: projectbluefin/actions/bootc-build/dnf-cache@ae3c45762b7eebb188dbd4850d23042e96e539d8 # v1
        with:
          action: restore
          cache-name: ${{ env.IMAGE_NAME }}
          cache-bust: ${{ hashFiles('**/Containerfile') }}

      - name: Detect changes
        id: detect-changes
        uses: projectbluefin/actions/bootc-build/detect-changes@ae3c45762b7eebb188dbd4850d23042e96e539d8 # v1
        with:
          filters: |
            image:
              - 'Containerfile'
              - 'build/**'
              - 'custom/**'
              - 'Justfile'

      - name: Build image
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        id: build-image
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_VENDOR: ${{ env.IMAGE_VENDOR }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
          REGISTRY_CACHE_WRITE: ${{ env.REGISTRY_CACHE_WRITE }}
        with:
          timeout_minutes: 120
          max_attempts: 3
          retry_wait_seconds: 300
          command: |
            sudo -E "$(command -v just)" build "${IMAGE_NAME}" "${DEFAULT_TAG}"

      - name: Get version label
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        id: version
        shell: bash
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
        run: |
          VERSION_LABEL=$(sudo podman inspect "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
          echo "version=${VERSION_LABEL}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION_LABEL}"

      - name: Generate tags
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        id: generate-tags
        uses: projectbluefin/actions/bootc-build/generate-tags@ae3c45762b7eebb188dbd4850d23042e96e539d8 # v1
        with:
          base-name: ${{ env.IMAGE_NAME }}
          stream-name: ${{ env.DEFAULT_TAG }}
          version-label: ${{ steps.version.outputs.version }}
          # ROOT CAUSE of the image publishing as `stable-daily` instead of the
          # docs' `stable`: this action's own script treats any "stable" stream
          # as a nightly-buffer stream by design -- it only ever emits the
          # literal `stable` tag when event-name is `schedule` AND today is
          # Tuesday, or when it is `workflow_dispatch`/`workflow_call` (see
          # generate_tags.sh in projectbluefin/actions). Every other trigger --
          # including OUR every-push-to-main build, and our daily non-Tuesday
          # cron -- only gets `stable-daily`. That gradual promotion cadence
          # fits Bluefin's own continuous-build model, but spinofin has no
          # separate staged-promotion step: every push to main is already
          # curated via PR review, so there is nothing to "buffer" before
          # promoting. We deliberately tell the action every non-PR trigger is
          # promotion-worthy (workflow_dispatch semantics) so it always emits
          # `stable`, matching what the README documents. PR semantics are
          # preserved untouched in case PR builds are ever re-enabled (see the
          # comment at the top of this file), so PR-only tags are never
          # accidentally promoted to `stable`.
          #
          # On the `testing` branch, stream-name is `testing` (see DEFAULT_TAG in
          # the Prepare step). The action only special-cases the literal `stable`
          # stream, so a `testing` stream simply emits `testing` and the dated
          # `testing-<version>` tags -- the workflow_dispatch override is inert
          # for it and needs no separate handling.
          event-name: ${{ github.event_name == 'pull_request' && 'pull_request' || 'workflow_dispatch' }}
          pr-number: ${{ github.event.number }}

      - name: Save DNF cache
        if: always() && !cancelled() && github.event_name != 'pull_request'
        uses: projectbluefin/actions/bootc-build/dnf-cache@ae3c45762b7eebb188dbd4850d23042e96e539d8 # v1
        with:
          action: save
          cache-name: ${{ env.IMAGE_NAME }}
          allow-write: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
          cache-bust: ${{ hashFiles('**/Containerfile') }}

      # Rechunking (OCI-native OTA-delta optimization) -- DELIBERATELY DISABLED.
      #
      # Rechunking reorganizes image layers by content so OTA updates download
      # only what changed. It is an OPTIONAL optimization and is intentionally
      # left OFF here, because neither OCI-native rechunker works on spinofin's
      # full-Bluefin base:
      #
      #   * projectbluefin/actions/bootc-build/chunka (wraps coreos/chunkah)
      #     re-applies base-image metadata by passing the image's full
      #     `podman inspect` output to `sudo` via the CHUNKAH_CONFIG_STR env var.
      #     Our full-Bluefin base has a large config (a long layer History), so
      #     that single string exceeds the kernel's fixed 128 KiB arg/env exec
      #     limit and sudo dies with E2BIG ("Argument list too long", exit 126).
      #     This is a hard kernel limit -- not tunable, and not fixable via the
      #     action's inputs (source-image / max-layers).
      #
      #   * bootc-base-imagectl rechunk (in-image, no env var -> no E2BIG) cannot
      #     run: /usr/libexec/bootc-base-imagectl is not present in
      #     ghcr.io/ublue-os/bluefin:stable.
      #
      # The remaining option, hhd-dev/rechunk, is OSTree/rpm-ostree-based, which
      # conflicts with the "no rpm-ostree" stance and the Track-B (GNOME OS bootc)
      # target. Rechunking is therefore deferred until either chunka gains
      # file-based config passing upstream, or the base ships bootc-base-imagectl.
      # It is an optimization, not a correctness requirement, so nothing else
      # depends on it. Full write-up: README "Adding Image Rechunking".

      - name: Tag images
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ALIAS_TAGS: ${{ steps.generate-tags.outputs.tags }}
        run: |
          sudo -E "$(command -v just)" tag-images "${IMAGE_NAME}" \
                          "${DEFAULT_TAG}" \
                          "${ALIAS_TAGS}"

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
        id: push
        uses: projectbluefin/actions/bootc-build/push-image@ae3c45762b7eebb188dbd4850d23042e96e539d8 # v1
        with:
          image-name: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.generate-tags.outputs.tags }}
          default-tag: ${{ steps.generate-tags.outputs.default-tag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Sign and attest (SLSA Build L2 provenance) -- keyless OIDC via Fulcio.
      # STABLE ONLY: gated to `main` so only :stable images are signed. :testing
      # images (built from the testing branch) are intentionally left unsigned.
      # Scheduled/dispatch runs on main are ref=refs/heads/main, so they sign too.
      # Requires 'id-token: write' (granted above).
      - name: Sign and publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: projectbluefin/actions/bootc-build/sign-and-publish@ae3c45762b7eebb188dbd4850d23042e96e539d8 # v1
        with:
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          digest: ${{ steps.push.outputs.digest }}
          signing-mode: keyless
          generate-sbom: false
          push-attestation: true
          certificate-identity-regexp: https://github.com/${{ github.repository }}/.github/workflows/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build telemetry summary
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        shell: bash
        run: |
          IMAGE_SIZE=$(sudo podman image inspect "localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}" \
            --format '{{.Size}}' 2>/dev/null || echo "0")
          IMAGE_SIZE_MB=$(( IMAGE_SIZE / 1024 / 1024 ))
          LAYER_COUNT=$(sudo podman image inspect "localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}" \
            --format '{{len .RootFS.Layers}}' 2>/dev/null || echo "?")

          {
            echo "## Build Telemetry: ${{ env.IMAGE_NAME }}"
            echo ""
            echo "**Image size (uncompressed):** ${IMAGE_SIZE_MB} MB"
            echo "**Layer count:** ${LAYER_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"
