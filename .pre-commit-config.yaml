# .pre-commit-config.yaml

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        # The full-color logo SVG is a committed design asset kept byte-exact;
        # end-of-file-fixer would rewrite its final line by appending a newline.
        exclude: '^docs/assets/spinofin-logo-full\.svg$'
      - id: trailing-whitespace
        # The fastfetch ASCII logo is padded with significant trailing spaces to
        # keep its block rectangular; stripping them mangles the designed art.
        exclude: '^custom/branding/system_files/usr/share/spinofin/fastfetch/'

  - repo: local
    hooks:
      - id: validate-brewfiles
        name: Validate Brewfiles
        entry: bash -c 'if command -v brew &> /dev/null; then for file in custom/brew/*.Brewfile*; do [ -f "$file" ] || continue; brew bundle check --file="$file" || exit 1; done; else echo "⚠️  Homebrew not installed, skipping Brewfile validation"; fi'
        language: system
        files: '^custom/brew/.*\.Brewfile.*$'
        pass_filenames: false
